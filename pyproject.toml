[project]
name = "diffpred"
version = "0.1.0"
description = ""
authors = [{ name = "Julien Horwood" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.7.0",
    "wandb>=0.19.6",
    "pytorch-lightning==2.4.0",
    "lightning==2.4.0",
    "pandas==2.1.4",
    "seaborn>=0.12.2",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "jupyter==1.0.0",
    "molfeat==0.10.0",
    "datamol>=0.12.4",
    "typer>=0.9.0",
    "hydra-core>=1.3.2",
    "hydra-joblib-launcher>=1.2.0",
    "pyTDC>=1.0.0",
    "MoleculeACE>=3.0.0",
    "torch-geometric>=2.5.3",
    "levenshtein>=0.25.1",
    "tensorflow>=2.16.1",
    "types-pyyaml>=6.0.12.20240311",
    "gpytorch>=1.11",
    "botorch>=0.11.0",
    "ogb>=1.3.6",
    "pytest>=8.3.2",
    "optuna>=4.1.0",
    "fastparquet>=2024.11.0",
    "optuna-integration>=4.2.0",
    "jax>=0.5.0",
    # Migrated manual dependencies:
    "polaris-lib==0.11.3",
    "setuptools==78.1.0",
    "requests>=2.32.5",
    "numcodecs<0.16.0",
    "chemprop>=2.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "ruff>=0.4.2",
    "pre-commit>=3.7.0",
    "pytest-mock>=3.15.1",
]

[build-system]
# Use a constraint that matches your uv version (e.g., 0.10.x)
requires = ["uv_build>=0.10.0,<0.11.0"] 
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "diffpred"
module-root = ""

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
