data:
  classification: false
  dataset: biogen/adme-fang-reg-v1
  diffusion_params:
    diffusion_type: null
    guidance: 1.0
    guidance_dropout: 0.2
    guidance_schedule: cosine
    refinement_steps: 10
    sigma_max: 10
    sigma_min: 0.0001
  log_transform: false
  name: polaris
  standardize_targets: true
  symmetric_binary_targets: true
  use_benchmark: true
experiment:
  callbacks: []
  check_val_freq: 10
  console_out: true
  debug: false
  device: null
  ema_decay: 0.99
  exp_name: ${data.name}_${data.dataset}_${model.name}
  monitor_metric: val/rmse
  monitor_mode: min
  output_dir: outputs_${experiment.exp_name}
  seed: 0
  tune: false
  tuning_n_trials: 50
  save_last_ckpt: False
  use_ema_on_test: true
  use_last_ckpt: false
  wandb_mode: null
model:
  featurizer: graph
  hparams:
    net_type: chemprop
    chemprop_message_passing: bond
    chemprop_aggregation: norm
    chemprop_depth: 3
    pooling: sum
    activation: relu
    dropout: 0
    batch_norm: false
    hidden_dim: 128
    num_hiddens: 3
    output_mlp_type: residual
    feature_hiddens:
    - 300
    cond_config:
      fusion_gating: false
      fusion_loc: post-branch
      fusion_type: none
      use_timestep_gating: false
  name: gnn
  training:
    loss_weights: true
    batch_size: 1024
    shuffle_train: true
    lr: 0.001
    num_pred_samples: 50
    max_epochs: 500
